<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass</title>
<style>
  :root{
    --bg1:#0f0f1e; --bg2:#1a1a2e; --glass:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.12); --text:#eef0ff; --sub:#9aa0c3;
    --accent:#7c5cff; --accent2:#22d3ee; --good:#34d399; --warn:#fbbf24;
    --frontend:#60a5fa; --backend:#a78bfa; --qa:#34d399; --pm:#fbbf24;
    --ux:#f472b6; --support:#22d3ee; --em:#f87171; --data:#facc15;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background: linear-gradient(135deg,var(--bg1),var(--bg2) 50%, #16213e);
    background-size:200% 200%;
    animation: bgshift 18s ease infinite;
    color:var(--text); min-height:100vh; padding:20px;
  }
  @keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .wrap{max-width:1000px; margin:0 auto;}
  header{text-align:center; margin-bottom:24px; animation:fadeDown .6s ease;}
  h1{font-size:2.4em; background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:1px;}
  .subtitle{color:var(--sub); margin-top:6px; font-size:1.05em;}
  @keyframes fadeDown{from{opacity:0; transform:translateY(-16px)} to{opacity:1; transform:translateY(0)}}

  .progress-bar{display:flex; gap:8px; margin:20px 0 28px; justify-content:center; flex-wrap:wrap;}
  .step{padding:8px 16px; border-radius:20px; background:var(--glass); border:1px solid var(--border);
        font-size:.85em; color:var(--sub); transition:.3s;}
  .step.active{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0f0f1e; font-weight:600;}
  .step.done{background:rgba(52,211,153,0.2); border-color:var(--good); color:var(--good);}

  .card{background:var(--glass); backdrop-filter:blur(14px); border:1px solid var(--border);
        border-radius:20px; padding:28px; margin-bottom:20px; animation:pop .4s ease;}
  @keyframes pop{from{opacity:0; transform:scale(.96)} to{opacity:1; transform:scale(1)}}

  .ticket{
    background:linear-gradient(135deg, rgba(124,92,255,0.15), rgba(34,211,238,0.08));
    border:1px dashed var(--accent2); border-radius:14px; padding:18px 20px; margin-bottom:22px;
    position:relative;
  }
  .ticket::before{content:"🎫 TICKET"; position:absolute; top:-11px; left:16px; background:var(--bg2);
    padding:2px 10px; font-size:.7em; letter-spacing:2px; color:var(--accent2); border-radius:8px;}
  .ticket p{font-size:1.15em; line-height:1.5; margin-top:6px;}

  .role-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin:16px 0;}
  .role-card{
    background:var(--glass); border:2px solid var(--border); border-radius:16px; padding:16px 10px;
    text-align:center; cursor:grab; transition:.25s; user-select:none; position:relative;
  }
  .role-card:hover{transform:translateY(-4px); box-shadow:0 8px 20px rgba(124,92,255,0.25); border-color:var(--accent);}
  .role-card.dragging{opacity:.4;}
  .role-card .emoji{font-size:1.8em; display:block; margin-bottom:6px;}
  .role-card .name{font-weight:600; font-size:.92em;}
  .role-card.selected-tag{outline:2px solid var(--accent2);}

  .drop-zone{
    min-height:90px; border:2px dashed var(--border); border-radius:16px; margin:18px 0;
    display:flex; align-items:center; justify-content:center; color:var(--sub);
    transition:.25s; font-size:.95em; flex-wrap:wrap; gap:10px; padding:10px;
  }
  .drop-zone.over{border-color:var(--accent2); background:rgba(34,211,238,0.08); transform:scale(1.02);}
  .drop-zone.filled{border-style:solid; border-color:var(--good);}
  .drop-zone .placed{
    background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0f0f1e;
    padding:10px 16px; border-radius:12px; font-weight:700; animation:snap .3s ease;
  }
  @keyframes snap{0%{transform:scale(1.3); opacity:0} 60%{transform:scale(0.95)} 100%{transform:scale(1); opacity:1}}

  .order-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:14px 0;}
  .order-slot{
    min-width:120px; min-height:64px; border:2px dashed var(--border); border-radius:12px;
    display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:.85em;
    position:relative; padding:6px;
  }
  .order-slot .num{position:absolute; top:-10px; left:8px; background:var(--bg2); font-size:.7em;
    color:var(--accent2); padding:1px 8px; border-radius:8px;}
  .order-slot.filled{border-style:solid; border-color:var(--good);}
  .arrow{color:var(--sub); font-size:1.3em;}

  .btn{
    background:linear-gradient(90deg,var(--accent),var(--accent2)); border:none; color:#0f0f1e;
    padding:12px 26px; border-radius:12px; font-weight:700; cursor:pointer; font-size:1em;
    transition:.2s; margin-top:10px;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(124,92,255,0.4);}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}
  .btn.secondary{background:var(--glass); color:var(--text); border:1px solid var(--border);}

  .reveal{
    margin-top:20px; padding:20px; border-radius:16px; background:rgba(52,211,153,0.08);
    border:1px solid rgba(52,211,153,0.3); animation:fadeUp .5s ease;
  }
  @keyframes fadeUp{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)}}
  .reveal h3{color:var(--good); margin-bottom:10px; font-size:1.1em;}
  .reveal .row{margin:8px 0; line-height:1.5;}
  .reveal .label{color:var(--accent2); font-weight:700; margin-right:6px;}
  .tag{display:inline-block; background:var(--glass); border:1px solid var(--border); padding:3px 10px;
       border-radius:10px; font-size:.82em; margin:2px 4px 2px 0;}

  .flow-anim{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:16px 0; min-height:50px;}
  .flow-node{background:var(--glass); border:1px solid var(--border); padding:8px 14px; border-radius:10px;
    opacity:0; transform:translateX(-20px); animation:slideIn .4s forwards;}
  @keyframes slideIn{to{opacity:1; transform:translateX(0)}}

  .support-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:14px 0;}
  .support-card{
    background:var(--glass); border:2px solid var(--border); border-radius:14px; padding:14px; text-align:center;
    cursor:pointer; transition:.2s;
  }
  .support-card:hover{transform:translateY(-3px);}
  .support-card.picked{border-color:var(--accent2); background:rgba(34,211,238,0.15);}
  .support-card .lim{font-size:.7em; color:var(--sub); display:block; margin-top:4px;}

  .score-wrap{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;}
  @media(max-width:700px){.score-wrap{grid-template-columns:1fr}}
  .bar-row{margin:12px 0;}
  .bar-label{display:flex; justify-content:space-between; font-size:.9em; margin-bottom:6px; color:var(--sub);}
  .bar-track{background:rgba(255,255,255,0.08); border-radius:10px; height:14px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:10px; background:linear-gradient(90deg,var(--accent),var(--accent2));
    width:0%; transition:width 1.2s cubic-bezier(.2,.9,.3,1);}

  .radar-svg{width:100%; max-width:320px; display:block; margin:0 auto;}

  .reflection-item{padding:14px 16px; border-radius:12px; background:var(--glass); border:1px solid var(--border);
    margin-bottom:12px;}
  .reflection-item .h{font-weight:700; margin-bottom:4px; color:var(--accent2);}

  .confetti{position:fixed; top:-10px; width:8px; height:8px; opacity:.9; z-index:999; border-radius:2px;
    animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg); opacity:0.3;}}

  .center{text-align:center;}
  .hint{color:var(--sub); font-size:.85em; margin-top:6px;}
  footer{text-align:center; color:var(--sub); font-size:.8em; margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧭 Task Compass</h1>
    <div class="subtitle">Learn how work flows through real organizations.</div>
  </header>

  <div class="progress-bar" id="progressBar"></div>
  <div id="app"></div>
  <footer>A management simulation — Tech Company edition</footer>
</div>

<script>
/* ---------------- DATA ---------------- */
const ROLES = [
  {id:'fe', name:'Frontend Developer', emoji:'🖥️', color:'var(--frontend)'},
  {id:'be', name:'Backend Developer', emoji:'⚙️', color:'var(--backend)'},
  {id:'qa', name:'QA Engineer', emoji:'🔍', color:'var(--qa)'},
  {id:'pm', name:'Product Manager', emoji:'📋', color:'var(--pm)'},
  {id:'ux', name:'UX Designer', emoji:'🎨', color:'var(--ux)'},
  {id:'support', name:'Customer Support', emoji:'💬', color:'var(--support)'},
  {id:'em', name:'Engineering Manager', emoji:'🧑‍💼', color:'var(--em)'},
  {id:'data', name:'Data Analyst', emoji:'📊', color:'var(--data)'}
];
const roleById = id => ROLES.find(r=>r.id===id);

// STAGE 1: 9 ownership tasks (game picks 3 at random each run for variety, but we show fixed 3 sequence set of 9 pool)
const STAGE1 = [
  {task:"A customer reports that payments fail only on iPhones.", owner:'be', why:"Payment failures point to a server-side or API integration bug, which Backend Developers own — even though it surfaces on a specific device.", assist:['qa','fe']},
  {task:"Users say the new checkout button is hard to find.", owner:'ux', why:"This is a usability and visual hierarchy problem, which is the UX Designer's core responsibility.", assist:['fe','pm']},
  {task:"The app crashes when opening the settings menu.", owner:'fe', why:"A crash tied to a specific screen or menu is typically a client-side rendering or logic bug, owned by the Frontend Developer.", assist:['qa','be']},
  {task:"A feature was shipped but nobody agreed on what 'done' meant.", owner:'pm', why:"Defining scope and acceptance criteria before release is a Product Manager responsibility.", assist:['em','ux']},
  {task:"Three customers report the same confusing error message this week.", owner:'support', why:"Customer Support is the first point of contact and owns triaging and logging recurring user-reported issues.", assist:['qa','pm']},
  {task:"A new release caused the database to slow down significantly.", owner:'be', why:"Database performance under new code changes is a backend systems concern.", assist:['em','data']},
  {task:"The team keeps missing sprint deadlines.", owner:'em', why:"Sprint planning, capacity, and team process issues are owned by the Engineering Manager.", assist:['pm']},
  {task:"A/B test results show a new layout underperforms.", owner:'data', why:"Interpreting experiment results and statistical significance is the Data Analyst's domain.", assist:['pm','ux']},
  {task:"A bug was found only after users had used the app for hours.", owner:'qa', why:"Long-session, edge-case bugs typically expose gaps in test coverage, making this a QA ownership issue for future prevention.", assist:['be','fe']},
  {task:"The onboarding flow has a very high drop-off rate.", owner:'ux', why:"Drop-off in a flow usually indicates a friction or clarity issue in the user experience design.", assist:['data','pm']}
];

// STAGE 2: routing tasks with correct order
const STAGE2 = [
  {task:"A user reports a bug through the app's help chat.", order:['support','qa','be','pm'],
   why:"Support first confirms and logs the issue, QA reproduces and verifies it's a real bug, Backend fixes the root cause, and the Product Manager confirms the fix before it's communicated back."},
  {task:"A customer requests a brand-new feature.", order:['support','pm','ux','fe','qa'],
   why:"Support relays the request, PM evaluates and prioritizes it, UX designs the experience, Frontend builds it, and QA validates it before release."},
  {task:"An engineer discovers a security vulnerability in login.", order:['be','em','qa'],
   why:"The engineer who finds it escalates immediately to their manager for urgency and resourcing, then QA verifies the fix works before deployment."},
  {task:"A customer complains about slow page load times.", order:['support','data','be'],
   why:"Support logs the complaint, Data Analyst investigates whether it's widespread or isolated, then Backend addresses the confirmed performance issue."},
  {task:"Marketing wants a new promotional banner shown to users.", order:['pm','ux','fe'],
   why:"PM aligns on goals and priority, UX designs the banner experience, and Frontend implements it — a lighter-weight three-step flow."}
];

// STAGE 3: collaboration scenarios
const STAGE3 = [
  {task:"Customer satisfaction suddenly drops.", primary:'pm',
   supports:['support','data','ux'],
   why:"The Product Manager coordinates the response, but understanding *why* satisfaction dropped requires Support's frontline reports, Data's trend analysis, and UX's review of recent experience changes.",
   flow:"Support → Data → UX → Product Manager → Team decision"},
  {task:"Sales increase dramatically overnight.", primary:'em',
   supports:['be','data','pm'],
   why:"Engineering Management ensures systems can handle scale, Backend monitors infrastructure load, Data confirms the cause and trend, and PM plans for sustained demand.",
   flow:"Data → Engineering Manager → Backend → Product Manager"},
  {task:"Negative reviews appear online about a recent update.", primary:'pm',
   supports:['support','qa','ux'],
   why:"PM owns the response strategy, Support gathers detail from affected users, QA checks for real defects behind the complaints, and UX reviews if a design change caused confusion.",
   flow:"Support → QA → UX → Product Manager → Public response"},
  {task:"A major feature is delayed close to launch.", primary:'em',
   supports:['pm','fe','be'],
   why:"The Engineering Manager reassesses timeline and resourcing, working with PM on scope trade-offs while Frontend and Backend report real technical blockers.",
   flow:"Frontend & Backend → Engineering Manager → Product Manager → Stakeholders"}
];

function pick3(arr){
  const copy=[...arr];
  const out=[];
  for(let i=0;i<3 && copy.length;i++){
    const idx=Math.floor(Math.random()*copy.length);
    out.push(copy.splice(idx,1)[0]);
  }
  return out;
}

const state = {
  stage:1, qIndex:0,
  s1: pick3(STAGE1), s2: pick3(STAGE2), s3: pick3(STAGE3),
  scores:{ownership:0, delegation:0, collaboration:0, workflow:0},
  maxScores:{ownership:3, delegation:3, collaboration:3, workflow:3},
  reflectionNotes:{overassign:0, undercollab:0}
};

/* ---------------- RENDER HELPERS ---------------- */
const app = document.getElementById('app');
const progressBar = document.getElementById('progressBar');

function renderProgress(){
  const labels = ['Stage 1: Ownership','Stage 2: Routing','Stage 3: Collaboration','Results'];
  progressBar.innerHTML = labels.map((l,i)=>{
    const stepNum=i+1;
    let cls='step';
    if(stepNum < state.stage) cls+=' done';
    else if(stepNum === state.stage) cls+=' active';
    return `<div class="${cls}">${l}</div>`;
  }).join('');
}

function roleCardHTML(role, draggable=true){
  return `<div class="role-card" draggable="${draggable}" data-role="${role.id}" style="border-color:${role.color}22">
    <span class="emoji">${role.emoji}</span>
    <span class="name">${role.name}</span>
  </div>`;
}

/* ---------------- STAGE 1 ---------------- */
function renderStage1(){
  renderProgress();
  const q = state.s1[state.qIndex];
  app.innerHTML = `
    <div class="card">
      <div class="ticket"><p>${q.task}</p></div>
      <p class="hint">Drag the role that should <b>own</b> this task into the slot below.</p>
      <div class="role-grid" id="roleGrid">
        ${ROLES.map(r=>roleCardHTML(r)).join('')}
      </div>
      <div class="drop-zone" id="ownerSlot">Drop the owner here</div>
      <button class="btn" id="submitBtn" disabled>Submit</button>
      <div id="revealArea"></div>
    </div>
  `;
  let chosen=null;
  const slot=document.getElementById('ownerSlot');
  const submitBtn=document.getElementById('submitBtn');

  document.querySelectorAll('#roleGrid .role-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.role);
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    card.addEventListener('click',()=>selectRole(card.dataset.role)); // mobile-friendly fallback
  });

  slot.addEventListener('dragover',e=>{e.preventDefault(); slot.classList.add('over');});
  slot.addEventListener('dragleave',()=>slot.classList.remove('over'));
  slot.addEventListener('drop',e=>{
    e.preventDefault(); slot.classList.remove('over');
    const roleId=e.dataTransfer.getData('text/plain');
    selectRole(roleId);
  });

  function selectRole(roleId){
    chosen=roleId;
    const r=roleById(roleId);
    slot.innerHTML=`<div class="placed">${r.emoji} ${r.name}</div>`;
    slot.classList.add('filled');
    submitBtn.disabled=false;
  }

  submitBtn.addEventListener('click',()=>{
    submitBtn.disabled=true;
    const correct = chosen===q.owner;
    if(correct) state.scores.ownership++;
    else state.reflectionNotes.overassign++;
    const ownerRole=roleById(q.owner);
    const assistRoles=q.assist.map(id=>roleById(id));
    document.getElementById('revealArea').innerHTML=`
      <div class="reveal">
        <h3>${correct? '✓ Great instinct' : '↻ Here is how it actually plays out'}</h3>
        <div class="row"><span class="label">Primary Owner:</span> ${ownerRole.emoji} ${ownerRole.name}</div>
        <div class="row"><span class="label">Why:</span> ${q.why}</div>
        <div class="row"><span class="label">May assist:</span> ${assistRoles.map(r=>`<span class="tag">${r.emoji} ${r.name}</span>`).join('')}</div>
        <button class="btn" id="nextBtn">Next →</button>
      </div>
    `;
    document.getElementById('nextBtn').addEventListener('click', nextInStage1);
  });
}

function nextInStage1(){
  state.qIndex++;
  if(state.qIndex >= state.s1.length){
    state.stage=2; state.qIndex=0;
    renderStage2();
  } else {
    renderStage1();
  }
}

/* ---------------- STAGE 2 ---------------- */
function renderStage2(){
  renderProgress();
  const q = state.s2[state.qIndex];
  const n = q.order.length;
  app.innerHTML = `
    <div class="card">
      <div class="ticket"><p>${q.task}</p></div>
      <p class="hint">Drag roles into order — build the workflow from first touch to resolution (${n} steps).</p>
      <div class="role-grid" id="roleGrid2">
        ${ROLES.map(r=>roleCardHTML(r)).join('')}
      </div>
      <div class="order-row" id="orderRow">
        ${Array.from({length:n}).map((_,i)=>`<div class="order-slot" data-pos="${i}"><span class="num">${i+1}</span><span class="ph">empty</span></div>${i<n-1?'<span class="arrow">→</span>':''}`).join('')}
      </div>
      <button class="btn" id="submitBtn2" disabled>Submit</button>
      <div id="revealArea2"></div>
    </div>
  `;
  const filled = new Array(n).fill(null);
  const slots = document.querySelectorAll('#orderRow .order-slot');
  const submitBtn2 = document.getElementById('submitBtn2');
  let selectedRole=null;

  document.querySelectorAll('#roleGrid2 .role-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.role);
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    card.addEventListener('click',()=>{
      document.querySelectorAll('#roleGrid2 .role-card').forEach(c=>c.classList.remove('selected-tag'));
      card.classList.add('selected-tag');
      selectedRole=card.dataset.role;
    });
  });

  slots.forEach(slot=>{
    slot.addEventListener('dragover',e=>{e.preventDefault(); slot.classList.add('over');});
    slot.addEventListener('dragleave',()=>slot.classList.remove('over'));
    slot.addEventListener('drop',e=>{
      e.preventDefault(); slot.classList.remove('over');
      const roleId=e.dataTransfer.getData('text/plain');
      placeInSlot(slot, roleId);
    });
    slot.addEventListener('click',()=>{
      if(selectedRole) placeInSlot(slot, selectedRole);
    });
  });

  function placeInSlot(slot, roleId){
    const pos = parseInt(slot.dataset.pos);
    const r = roleById(roleId);
    filled[pos]=roleId;
    slot.innerHTML=`<span class="num">${pos+1}</span><div class="placed">${r.emoji} ${r.name}</div>`;
    slot.classList.add('filled');
    submitBtn2.disabled = filled.includes(null);
  }

  submitBtn2.addEventListener('click',()=>{
    submitBtn2.disabled=true;
    let correctCount=0;
    for(let i=0;i<n;i++) if(filled[i]===q.order[i]) correctCount++;
    const fullyCorrect = correctCount===n;
    if(fullyCorrect) state.scores.workflow++;
    else if(correctCount>=Math.ceil(n/2)) state.scores.workflow += 0.5;

    const revealArea=document.getElementById('revealArea2');
    revealArea.innerHTML=`
      <div class="reveal">
        <h3>${fullyCorrect? '✓ Clean workflow' : '↻ Here is the typical path'}</h3>
        <div class="flow-anim" id="flowAnim"></div>
        <div class="row"><span class="label">Why this order:</span> ${q.why}</div>
        <button class="btn" id="nextBtn2">Next →</button>
      </div>
    `;
    const flowAnim = document.getElementById('flowAnim');
    q.order.forEach((rid,i)=>{
      const r=roleById(rid);
      const node=document.createElement('div');
      node.className='flow-node';
      node.style.animationDelay=(i*0.25)+'s';
      node.innerHTML = `${r.emoji} ${r.name}`;
      flowAnim.appendChild(node);
      if(i<q.order.length-1){
        const arrow=document.createElement('span');
        arrow.className='flow-node';
        arrow.style.animationDelay=(i*0.25+0.12)+'s';
        arrow.innerHTML='→';
        flowAnim.appendChild(arrow);
      }
    });
    document.getElementById('nextBtn2').addEventListener('click', nextInStage2);
  });
}

function nextInStage2(){
  state.qIndex++;
  if(state.qIndex >= state.s2.length){
    state.stage=3; state.qIndex=0;
    renderStage3();
  } else {
    renderStage2();
  }
}

/* ---------------- STAGE 3 ---------------- */
function renderStage3(){
  renderProgress();
  const q = state.s3[state.qIndex];
  app.innerHTML = `
    <div class="card">
      <div class="ticket"><p>${q.task}</p></div>
      <p class="hint">Select up to 4 roles you'd involve. Think beyond one owner — who needs to collaborate?</p>
      <div class="support-grid" id="supportGrid">
        ${ROLES.map(r=>`<div class="support-card" data-role="${r.id}">
            <span class="emoji" style="font-size:1.6em">${r.emoji}</span>
            <div class="name">${r.name}</div>
          </div>`).join('')}
      </div>
      <div class="center hint" id="pickCount">0 of 4 selected</div>
      <div class="center"><button class="btn" id="submitBtn3" disabled>Submit</button></div>
      <div id="revealArea3"></div>
    </div>
  `;
  const picked = new Set();
  const submitBtn3 = document.getElementById('submitBtn3');
  const pickCount = document.getElementById('pickCount');

  document.querySelectorAll('#supportGrid .support-card').forEach(card=>{
    card.addEventListener('click',()=>{
      const id=card.dataset.role;
      if(picked.has(id)){
        picked.delete(id); card.classList.remove('picked');
      } else {
        if(picked.size>=4) return;
        picked.add(id); card.classList.add('picked');
      }
      pickCount.textContent = `${picked.size} of 4 selected`;
      submitBtn3.disabled = picked.size===0;
    });
  });

  submitBtn3.addEventListener('click',()=>{
    submitBtn3.disabled=true;
    const chosenArr=[...picked];
    const hasPrimary = chosenArr.includes(q.primary);
    const supportOverlap = chosenArr.filter(id=>q.supports.includes(id)).length;

    if(hasPrimary) state.scores.ownership += 0.5;
    if(chosenArr.length>=2) state.scores.collaboration++;
    else state.reflectionNotes.undercollab++;
    if(supportOverlap>=1) state.scores.delegation++;

    const primaryRole=roleById(q.primary);
    const supportRoles=q.supports.map(id=>roleById(id));
    document.getElementById('revealArea3').innerHTML=`
      <div class="reveal">
        <h3>How this typically unfolds</h3>
        <div class="row"><span class="label">Primary Owner:</span> ${primaryRole.emoji} ${primaryRole.name}</div>
        <div class="row"><span class="label">Supporting Teams:</span> ${supportRoles.map(r=>`<span class="tag">${r.emoji} ${r.name}</span>`).join('')}</div>
        <div class="row"><span class="label">Reasoning:</span> ${q.why}</div>
        <div class="row"><span class="label">Communication Flow:</span> ${q.flow}</div>
        <button class="btn" id="nextBtn3">Next →</button>
      </div>
    `;
    document.getElementById('nextBtn3').addEventListener('click', nextInStage3);
  });
}

function nextInStage3(){
  state.qIndex++;
  if(state.qIndex >= state.s3.length){
    state.stage=4;
    renderResults();
  } else {
    renderStage3();
  }
}

/* ---------------- RESULTS ---------------- */
function renderResults(){
  renderProgress();
  const cats = ['ownership','delegation','collaboration','workflow'];
  const labels = {ownership:'Ownership', delegation:'Delegation', collaboration:'Collaboration', workflow:'Workflow Thinking'};
  const pct = {};
  cats.forEach(c=> pct[c] = Math.round((state.scores[c]/state.maxScores[c])*100));

  // Radar polygon points
  const center=160, radius=110;
  const angles = cats.map((_,i)=> (Math.PI/2) + i*(2*Math.PI/cats.length) * -1); // start top, clockwise
  function pointFor(i, valuePct){
    const angle = angles[i];
    const r = radius * (valuePct/100);
    return [center + r*Math.cos(angle), center - r*Math.sin(angle)];
  }
  const polyPoints = cats.map((c,i)=>pointFor(i, Math.max(pct[c],4)).join(',')).join(' ');
  const gridLevels=[25,50,75,100];
  const gridPolys = gridLevels.map(lvl=> cats.map((c,i)=>pointFor(i,lvl).join(',')).join(' '));
  const labelPoints = cats.map((c,i)=>{
    const angle=angles[i];
    const r = radius+26;
    return {x:center+r*Math.cos(angle), y:center-r*Math.sin(angle), text:labels[c]};
  });

  // Reflection text generation
  const overassign = state.reflectionNotes.overassign;
  const undercollab = state.reflectionNotes.undercollab;
  const strongest = cats.reduce((a,b)=> pct[a]>=pct[b]?a:b);

  app.innerHTML = `
    <div class="card">
      <h2 class="center" style="margin-bottom:6px;">🎉 Simulation Complete</h2>
      <p class="center hint">Here's how your organizational thinking maps out.</p>
      <div class="score-wrap">
        <div>
          <svg class="radar-svg" viewBox="0 0 320 320">
            ${gridPolys.map(p=>`<polygon points="${p}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>`).join('')}
            <polygon points="${polyPoints}" fill="rgba(124,92,255,0.35)" stroke="var(--accent2)" stroke-width="2"/>
            ${labelPoints.map(l=>`<text x="${l.x}" y="${l.y}" fill="var(--sub)" font-size="11" text-anchor="middle">${l.text}</text>`).join('')}
          </svg>
        </div>
        <div>
          ${cats.map(c=>`
            <div class="bar-row">
              <div class="bar-label"><span>${labels[c]}</span><span>${pct[c]}%</span></div>
              <div class="bar-track"><div class="bar-fill" data-w="${pct[c]}"></div></div>
            </div>
          `).join('')}
        </div>
      </div>

      <h3 style="margin-top:26px; margin-bottom:12px; color:var(--accent2)">Final Reflection</h3>
      <div class="reflection-item">
        <div class="h">✓ What you understood well</div>
        <div>Your strongest area was <b>${labels[strongest]}</b> — you tended to reason clearly about how work should move and who should be involved.</div>
      </div>
      <div class="reflection-item">
        <div class="h">⚖️ Where you tended to over-assign responsibility</div>
        <div>${overassign>0
          ? `In a few cases, you assigned ownership to a role that was more likely to assist than lead. This is common — many tasks look like they belong to the most visible role, not the most responsible one.`
          : `You were generally precise about who should hold primary ownership — nice work distinguishing owners from helpers.`}</div>
      </div>
      <div class="reflection-item">
        <div class="h">🤝 Where you underestimated collaboration</div>
        <div>${undercollab>0
          ? `On some complex scenarios, you leaned toward a single owner when the situation likely called for a small team working together.`
          : `You consistently recognized when a situation needed multiple people involved, rather than one owner acting alone.`}</div>
      </div>
      <div class="reflection-item">
        <div class="h">💡 One insight about how organizations actually work</div>
        <div>Many real workplace problems are solved by teams rather than individuals — ownership usually means coordinating the right people, not doing everything alone.</div>
      </div>

      <div class="center" style="margin-top:20px;">
        <button class="btn secondary" id="restartBtn">Play Again</button>
      </div>
    </div>
  `;
  requestAnimationFrame(()=>{
    document.querySelectorAll('.bar-fill').forEach(el=>{
      el.style.width = el.dataset.w + '%';
    });
  });
  launchConfetti();
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    state.stage=1; state.qIndex=0;
    state.s1=pick3(STAGE1); state.s2=pick3(STAGE2); state.s3=pick3(STAGE3);
    state.scores={ownership:0, delegation:0, collaboration:0, workflow:0};
    state.reflectionNotes={overassign:0, undercollab:0};
    renderStage1();
  });
}

function launchConfetti(){
  const colors=['#7c5cff','#22d3ee','#34d399','#fbbf24','#f472b6'];
  for(let i=0;i<40;i++){
    const el=document.createElement('div');
    el.className='confetti';
    el.style.left=Math.random()*100+'vw';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration=(2+Math.random()*2)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4500);
  }
}

/* ---------------- INIT ---------------- */
renderStage1();
</script>
</body>
</html>
